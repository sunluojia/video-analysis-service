[project]
name = "video-analysis-service"
version = "0.1.0"
description = "视频识别与作者 AI 标签汇总服务，供调度中心调用"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "anyio>=4.9",
    "asyncpg>=0.30",
    "dramatiq[redis]>=2.2",
    "fastapi>=0.163",
    "httpx>=0.28",
    "langchain>=1.5",
    "langchain-openai>=1.1",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.2", "ruff>=0.17"]

[project.scripts]
# 任务接收进程用 Dramatiq 命令行启动：dramatiq video_analysis.entrypoints.consumer:broker
video-analysis-api = "video_analysis.entrypoints.api:main"
video-analysis-worker = "video_analysis.entrypoints.worker:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# 中文注释和提示词里的全角标点是正常写法。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/video_analysis/modules/ai/prompt/builtin.py" = ["E501"]
